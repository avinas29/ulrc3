[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ulrc3"
version = "1.0.0"
description = "Ultra Low-Resource LLM Context Compression Engine - a semantic compiler for LLM context"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["llm", "prompt-compression", "context", "rag", "tokens", "inference"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core engine has ZERO required third-party dependencies.  Every optional
# backend degrades gracefully: no tiktoken -> calibrated heuristic tokenizer,
# no numpy -> pure-python PageRank, no fastapi -> library and CLI still work.
dependencies = []

[project.optional-dependencies]
tokenizers = ["tiktoken>=0.5"]
fast = ["numpy>=1.24"]
server = ["fastapi>=0.100", "uvicorn[standard]>=0.23", "pydantic>=2.0"]
hf = ["transformers>=4.35"]
onnx = ["onnxruntime>=1.16", "numpy>=1.24"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.1", "mypy>=1.6", "httpx>=0.25"]
all = [
  "tiktoken>=0.5", "numpy>=1.24", "fastapi>=0.100", "uvicorn[standard]>=0.23",
  "pydantic>=2.0", "httpx>=0.25",
]

[project.scripts]
ulrc3 = "ulrc3.cli:main"

[project.urls]
Documentation = "https://github.com/ulrc3/ulrc3/tree/main/docs"
Source = "https://github.com/ulrc3/ulrc3"

[tool.setuptools.packages.find]
include = ["ulrc3*"]

[tool.setuptools.package-data]
# The demo console is served by the API process, so it must ship inside the
# wheel -- otherwise `pip install ulrc3 && ulrc3 serve` 404s on "/".
ulrc3 = ["confidence.json", "server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
# B905: several zips intentionally rely on truncation (ragged rows, partial
# ladders); forcing strict= would turn a documented behaviour into an exception.
# SIM102/SIM105: the nested conditionals and try/except/pass that remain are
# each documented in place; collapsing them would hide the reason for the guard.
ignore = ["E501", "B008", "SIM108", "SIM102", "SIM105", "B905"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
